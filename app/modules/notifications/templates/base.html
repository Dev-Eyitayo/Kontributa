<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block title %}Kontributa{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F4FAED;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4FAED;">
<tr>
<td align="center" style="padding:40px 16px;">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:480px;max-width:100%;">

<!-- Wordmark, sitting directly on the page -- no dark banner. Real
     apps built on this brand never put the logo in a colored bar; it
     sits on the paper background exactly like this everywhere else. -->
<tr>
<td style="padding:0 4px 28px;">
<img src="{{ logo_url }}" width="150" height="45" alt="Kontributa" style="display:block;border:0;outline:none;">
</td>
</tr>

<!-- Content card. White-on-paper is the one case this app's own design
     system calls for a border (see Card.tsx: background contrast alone
     isn't quite enough there) -- plus a left accent stripe, the same
     idiom the dashboard itself uses for a flagged/lagging/urgent item,
     so the email's "mood" reads before a single word is read. -->
<tr>
<td style="background-color:#ffffff;border:1px solid rgba(27,40,17,0.14);border-left:4px solid {% block accent_color %}#1B2811{% endblock %};border-radius:10px;padding:36px 32px;">
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1B2811;font-size:15px;line-height:1.65;">
{% block content %}{% endblock %}
</div>
</td>
</tr>

<!-- Footer -->
<tr>
<td style="padding:22px 4px 0;">
<table role="presentation" cellpadding="0" cellspacing="0">
<tr>
<td style="padding-right:10px;vertical-align:middle;">
<img src="{{ icon_url }}" width="16" height="16" alt="" style="display:block;border:0;outline:none;">
</td>
<td style="vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#5B6472;font-size:12px;line-height:1.5;">
Sent by Kontributa &mdash; automated, safe to ignore if you weren&rsquo;t expecting it.
</td>
</tr>
</table>
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
